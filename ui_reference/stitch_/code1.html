<body class="bg-background text-on-background antialiased overflow-hidden texture-overlay">
<!-- LAYER 1: Background Content (Search Results) - Blurred & Inactive -->
<div class="h-screen w-full overflow-y-auto pointer-events-none blur-[2px] opacity-80">
<!-- TopAppBar (from JSON) -->
<header class="fixed top-0 w-full z-10 flex items-center px-8 h-16 bg-[#F7F3E8] border-b-[0.5px] border-stone-300">
<button class="mr-4 text-[#2C2C2C] hover:bg-stone-200/50 p-2 rounded-full transition-opacity duration-300 active:opacity-70">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">arrow_back</span>
</button>
<h1 class="flex-1 text-center text-xl font-bold text-[#2C2C2C] font-noto-serif tracking-widest">藝文檢索</h1>
<button class="ml-4 text-[#2C2C2C] hover:bg-stone-200/50 p-2 rounded-full transition-opacity duration-300 active:opacity-70">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">search</span>
</button>
</header>
<!-- Main Content Canvas -->
<main class="pt-24 pb-32 px-container-margin max-w-4xl mx-auto flex flex-col gap-section-gap">
<!-- Result Card 1 -->
<article class="flex flex-col md:flex-row gap-gutter bg-surface-container-low p-6 border-[0.5px] border-outline-variant/30 rounded-sm relative">
<div class="w-full md:w-1/3 aspect-[3/4] relative overflow-hidden bg-surface-variant/50">
<img alt="Cover image" class="object-cover w-full h-full mix-blend-multiply opacity-90" data-alt="ancient chinese calligraphy scroll on weathered wooden table with soft diffused natural light" src="https://lh3.googleusercontent.com/aida-public/AB6AXuDhYaAAADlw4WSkTi-M-u728qf6NMW5DgeXRjL3VHMvAUHiO8h4WM27ybkAvglG0CgfUH5qP5MW8IKPJggeqd-fiQU6sb53ElTSU-c3acfYPzXjdn_vxwgwli9TxmLixJYrrIVkxU7NL4Q3znKI9Aavs64qwJ6_jzYVV3bRjhXNRl9rO0l1U4LfhBxIWFkf4RJKfmn-B_TZIqLgpTULoXn5OaCadMG8zL7228Wj0OKEBL7S_HD6qXBgXa-3A6EGKx0XTqv99eQWt5Lg">
</div>
<div class="w-full md:w-2/3 flex flex-col justify-center space-y-stack-md">
<h2 class="font-headline-md text-headline-md text-tertiary">筆墨之境</h2>
<p class="font-body-md text-body-md text-on-surface-variant line-clamp-3">
                        書法不僅是文字的記錄，更是心性的流露。在點畫之間，可見宇宙之大，亦察秋毫之末。古人云：「書者，如也，如其學，如其才，如其志，總之曰如其人而已。」
                    </p>
<div class="pt-stack-sm flex items-center gap-2 text-primary-container">
<span class="w-1 h-1 bg-tertiary-container"></span>
<span class="font-label-sm text-label-sm uppercase">文獻選讀</span>
</div>
</div>
</article>
<!-- Result Card 2 -->
<article class="flex flex-col md:flex-row-reverse gap-gutter bg-surface-container-low p-6 border-[0.5px] border-outline-variant/30 rounded-sm relative">
<div class="w-full md:w-1/3 aspect-[3/4] relative overflow-hidden bg-surface-variant/50">
<img alt="Cover image" class="object-cover w-full h-full mix-blend-multiply opacity-90" data-alt="minimalist zen garden raked sand with a single smooth dark stone casting long shadows at sunset" src="https://lh3.googleusercontent.com/aida-public/AB6AXuCoVJQhbxzATcqh4xaGpbOkJuxzi8j-vHWSpaODt76us74TicTyFusjAUTyAvF7TS3d8lTC3361u3Sp3qfu3pnZfL0Qm8VCtFZ58A-KJ0VhIqvw7zmiNd1shdF5-Gh2Nk2sMDAf0wJSDLZlgD31eibFFfXnY3jVDULyyrszmsnpRUMDgvfZoqiVFjrzhl7nqQ7sRuEofwgPa-uyfpVG8h0tMdzi47K_t81C7cFMNSycSVwItyQk92NhhbdHMN-G1YCHLWikA8MNwAv1">

<p class="font-body-md text-body-md text-on-surface-variant line-clamp-3">
                        庭院中的砂石代表海洋，岩石象徵島嶼。無需一滴水，卻能展現波瀾壯闊的自然之景。這便是東方美學中「無畫處皆成妙境」的具體體現。
                    </p>
<div class="pt-stack-sm flex items-center gap-2 text-primary-container">
<span class="w-1 h-1 bg-tertiary-container"></span>

<button class="w-full flex items-center gap-4 p-5 rounded-lg border-[0.5px] border-stone-400/50 bg-[#FDFBF7]/50 hover:bg-[#F7F3E8] text-[#2C2C2C] transition-colors duration-300 group">
<div class="flex-shrink-0 w-10 h-10 flex items-center justify-center rounded-md bg-white border border-stone-300 shadow-sm group-hover:border-[#B22222]/30">
<span class="material-symbols-outlined text-[#B22222]" style="font-variation-settings: 'FILL' 0;">document_scanner</span>
</div>
<div class="flex flex-col items-start text-left">
<span class="font-noto-serif text-base font-medium tracking-wide">識別</span>
<span class="font-label-sm text-label-sm text-stone-500 mt-1 lowercase">Scan &amp; Extract</span>
</div>
</button>
</li>

<div class="flex-shrink-0 w-10 h-10 flex items-center justify-center rounded-md bg-white border border-stone-300 shadow-sm group-hover:border-[#B22222]/30">

<div class="flex flex-col items-start text-left">

</div>
</button>
</li>
